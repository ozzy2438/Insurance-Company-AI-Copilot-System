2. Insurance & Claims - policy coverage checks, claim processing, first contact resolution
3. Member Contact Centre - multi-product queries, member history, escalations

Guidelines:
- Be concise and structured (use bullet points and headers)
- Be operationally focused (what should the agent do next)
- Flag decisions that require human review
- Always keep the member experience central

- Make final decisions on claim approvals without flagging for human review
- Reference actual member data (this is a training/demo environment)

};

const DecisionBadge = ({ d }) => {

  return <span className={`inline-flex px-2 py-0.5 rounded text-xs font-medium ${c}`}>{l}</span>;

const ChatPage = () => {
  const [msgs, setMsgs] = useState([{ role: 'assistant', content: "Hello! I'm your internal Copilot assistant.\n\nI can help you summarise member situations, check policies, draft communications, and suggest next actions.\n\nSelect an agent context from the panel, then ask me anything." }]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [role, setRole] = useState('Roadside Assistance');
  const [status, setStatus] = useState('checking');
  const [copied, setCopied] = useState(null);
  const bottomRef = useRef(null);
  const taRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [msgs, loading]);

  useEffect(() => {
    fetch('http://localhost:11434/api/tags', { signal: AbortSignal.timeout(3000) })
      .then(r => setStatus(r.ok ? 'ok' : 'error'))
      .catch(() => setStatus('error'));
  }, []);

  const send = async () => {
    const text = input.trim();
    if (!text || loading) return;
    const newMsgs = [...msgs, { role: 'user', content: text }];
    setMsgs(newMsgs);
    setInput('');
    setLoading(true);
    try {
      const res = await fetch('http://localhost:11434/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'deepseek-r1:14b',
          stream: true,
          messages: [
            { role: 'system', content: SYSTEM_PROMPT + `\n\nCurrent agent context: ${role}.` },
            ...newMsgs
          ]
        })
      });
      if (!res.ok) throw new Error('bad response');
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let acc = '';
      setMsgs(p => [...p, { role: 'assistant', content: '' }]);
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const lines = dec.decode(value).split('\n').filter(Boolean);
        for (const line of lines) {
          try {
            const j = JSON.parse(line);
            if (j.message?.content) {
              acc += j.message.content;
              setMsgs(p => {
                const u = [...p];
                u[u.length - 1] = { role: 'assistant', content: acc };
                return u;
              });
            }
          } catch (err) {
          }
        }
      }
    } catch (err) {
      setMsgs(p => [...p, { role: 'assistant', content: 'Cannot connect to the local AI model.\n\nEnsure Ollama is running:\n```\nollama run deepseek-r1:14b\n```\nDefault endpoint: http://localhost:11434', isError: true }]);
    }
    setLoading(false);
  };

  const copyMsg = (content, id) => {
    navigator.clipboard.writeText(content);
    setCopied(id);
    setTimeout(() => setCopied(null), 2000);
  };

  const clear = () => setMsgs([{ role: 'assistant', content: 'Chat cleared. How can I help you?' }]);

  const QUICK = [
    'Summarise a roadside breakdown situation for a member named James with a flat tyre in Carlton',
    'Check if water damage to a member\'s home is covered under standard home policy',
    'Draft a post-call handover note for an escalated insurance claim',
    'What\'s the next best action for a member who has called 3 times about the same issue?'
  ];

  return (
    <div className="flex gap-4" style={{ height: 'calc(100vh - 128px)' }}>
      <div className="w-60 flex-shrink-0 flex flex-col gap-3">
        <div className={`flex items-center gap-2 px-3 py-2.5 rounded-lg border text-xs font-medium ${status === 'ok' ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : status === 'error' ? 'bg-red-50 border-red-200 text-red-700' : 'bg-gray-50 border-gray-200 text-gray-500'}`}>
          <span className={`w-2 h-2 rounded-full flex-shrink-0 ${status === 'ok' ? 'bg-emerald-500' : status === 'error' ? 'bg-red-500' : 'bg-gray-400'}`}/>
          {status === 'ok' ? 'deepseek-r1:14b - Connected' : status === 'error' ? 'Ollama not detected' : 'Checking model...'}
        </div>

        <div className="bg-white rounded-xl border border-gray-100 p-3">
          <div className="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-2">Agent Context</div>
          {['Roadside Assistance', 'Insurance & Claims', 'Contact Centre'].map(r => (
            <button key={r} onClick={() => setRole(r)}
              className={`w-full text-left px-3 py-2 rounded-lg text-sm mb-1 transition-colors ${role === r ? 'text-white' : 'hover:bg-gray-50 text-gray-600'}`}
              style={role === r ? { backgroundColor: NAVY } : {}}>
              {r}
            </button>
          ))}
        </div>

        <div className="bg-white rounded-xl border border-gray-100 p-3 flex-1">
          <div className="text-xs font-semibold text-gray-500 uppercase tracking-widest mb-2">Quick Starts</div>
          {QUICK.map((q, i) => (
            <button key={i} onClick={() => setInput(q)}
              className="w-full text-left text-xs text-gray-500 hover:text-gray-800 hover:bg-gray-50 px-2 py-2 rounded leading-relaxed mb-0.5 transition-colors">
              {q}
            </button>
          ))}
        </div>
      </div>

      <div className="flex-1 flex flex-col bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <div className="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
          <div>
            <span className="text-sm font-semibold text-gray-800 font-sora">Copilot Chat</span>
            <span className="ml-2 text-xs text-gray-400">- {role}</span>
          </div>
          <button onClick={clear} className="flex items-center gap-1.5 text-xs text-gray-400 hover:text-gray-600 px-2 py-1.5 rounded hover:bg-gray-50 transition-colors">
            {I.trash()} Clear chat
          </button>
        </div>

        <div className="flex-1 overflow-y-auto px-5 py-5 space-y-4">
          {msgs.map((m, i) => (
            <div key={i} className={`msg-in flex gap-3 ${m.role === 'user' ? 'flex-row-reverse' : ''}`}>
              <div className="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 text-white text-xs"
                style={{ backgroundColor: m.role === 'user' ? AMBER : NAVY }}>
                {m.role === 'user' ? I.user() : I.bot()}
              </div>
              <div className="max-w-[78%] group relative">
                <div className={`rounded-xl px-4 py-3 text-sm leading-relaxed whitespace-pre-wrap ${
                  m.role === 'user' ? 'bg-amber-50 border border-amber-100 text-gray-800' :
                  m.isError ? 'bg-red-50 border border-red-100 text-red-800' :
                  'bg-gray-50 border border-gray-100 text-gray-800'}`}>
                  {m.content}
                </div>
                {m.role === 'assistant' && !m.isError && m.content && (
                  <button onClick={() => copyMsg(m.content, i)}
                    className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity p-1 rounded hover:bg-gray-200 text-gray-400 hover:text-gray-600">
                    {copied === i ? <span className="text-emerald-600">{I.check()}</span> : I.copy()}
                  </button>
                )}
              </div>
            </div>
          ))}
          {loading && (
            <div className="flex gap-3">
              <div className="w-7 h-7 rounded-full flex items-center justify-center text-white" style={{ backgroundColor: NAVY }}>{I.bot()}</div>
              <div className="bg-gray-50 border border-gray-100 rounded-xl px-4 py-3.5">
                <div className="flex gap-1.5 items-center">
                  <span className="dot1 w-2 h-2 bg-gray-400 rounded-full block"/>
                  <span className="dot2 w-2 h-2 bg-gray-400 rounded-full block"/>
                  <span className="dot3 w-2 h-2 bg-gray-400 rounded-full block"/>
                </div>
              </div>
            </div>
          )}
          <div ref={bottomRef}/>
        </div>

        <div className="px-5 py-4 border-t border-gray-100">
          <div className="flex gap-2.5">
            <textarea ref={taRef} value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
              placeholder="Ask about member situations, policies, or request a communication draft..."
              rows={2}
              className="flex-1 resize-none rounded-xl border border-gray-200 px-4 py-2.5 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 transition-shadow leading-relaxed"
              style={{ '--tw-ring-color': 'rgba(217,119,6,0.3)' }}
            />
            <button onClick={send} disabled={loading || !input.trim()}
              className="px-4 rounded-xl text-white flex items-center justify-center transition-opacity disabled:opacity-40"
              style={{ backgroundColor: NAVY }}>
              {I.send()}
            </button>
          </div>
          <p className="text-xs text-gray-400 mt-1.5">
            Enter to send - Shift+Enter for newline - Responses are AI-generated and require human verification before use
          </p>
        </div>
      </div>
    </div>
  );
};

const PromptLibraryPage = () => {
  const [cat, setCat] = useState('All');
  const [search, setSearch] = useState('');
  const [copied, setCopied] = useState(null);
  const [expanded, setExpanded] = useState(null);

  const CATS = ['All', 'Roadside', 'Claims', 'Contact Centre', 'General'];
  const CAT_COLOR = { Roadside: 'bg-blue-100 text-blue-700', Claims: 'bg-purple-100 text-purple-700', 'Contact Centre': 'bg-teal-100 text-teal-700', General: 'bg-gray-100 text-gray-600' };

  const filtered = PROMPTS.filter(p => {
    const mc = cat === 'All' || p.category === cat;
    const ms = !search || [p.title, p.prompt, ...p.tags].some(s => s.toLowerCase().includes(search.toLowerCase()));
    return mc && ms;
  });

  const copy = (prompt, id) => {
    navigator.clipboard.writeText(prompt);
    setCopied(id);
    setTimeout(() => setCopied(null), 2000);
  };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-xl font-semibold text-gray-900 font-sora">Prompt Library</h1>
        <p className="text-sm text-gray-500 mt-0.5">Approved, role-specific prompts for frontline Copilot use. Copy and adapt as needed.</p>
      </div>

      <div className="flex items-center gap-3 flex-wrap">
        <div className="relative">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">{I.search()}</span>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search prompts..."
            className="pl-9 pr-4 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400/30 w-56"/>
        </div>
        <div className="flex gap-2 flex-wrap">
          {CATS.map(c => (
            <button key={c} onClick={() => setCat(c)}
              className={`px-3.5 py-1.5 rounded-lg text-sm font-medium transition-colors ${cat === c ? 'text-white' : 'bg-white border border-gray-200 text-gray-600 hover:border-gray-300'}`}
              style={cat === c ? { backgroundColor: NAVY } : {}}>
              {c}
            </button>
          ))}
        </div>
        <span className="ml-auto text-sm text-gray-400">{filtered.length} prompts</span>
      </div>

      <div className="grid grid-cols-2 gap-4">
        {filtered.map(p => (
          <div key={p.id} className="bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow flex flex-col">
            <div className="px-5 py-4 border-b border-gray-50">
              <div className="flex items-start justify-between gap-2">
                <div>
                  <div className="text-sm font-semibold text-gray-900">{p.title}</div>
                  <span className={`inline-flex mt-1 px-2 py-0.5 rounded text-xs font-medium ${CAT_COLOR[p.category]}`}>{p.category}</span>
                </div>
                <div className="text-right flex-shrink-0">
                  <div className="text-xs text-gray-500">{p.usage} uses</div>
                  <div className="text-xs font-medium" style={{ color: AMBER }}>★ {p.rating}</div>
                </div>
              </div>
            </div>

            <div className="px-5 py-4 flex-1">
              <p className={`text-xs text-gray-600 leading-relaxed ${expanded === p.id ? '' : 'lc3'}`}>{p.prompt}</p>
              {p.prompt.length > 160 && (
                <button onClick={() => setExpanded(expanded === p.id ? null : p.id)}
                  className="text-xs font-medium mt-1.5" style={{ color: AMBER }}>
                  {expanded === p.id ? 'Show less ↑' : 'Show more ↓'}
                </button>
              )}
            </div>

            <div className="px-5 pb-4 flex items-center justify-between">
              <div className="flex flex-wrap gap-1">
                {p.tags.map(t => (
                  <span key={t} className="inline-flex items-center gap-0.5 px-1.5 py-0.5 bg-gray-100 rounded text-xs text-gray-500">
                    {I.tag()} {t}
                  </span>
                ))}
              </div>
              <button onClick={() => copy(p.prompt, p.id)}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors flex-shrink-0 ${copied === p.id ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                {copied === p.id ? <><span>{I.check()}</span> Copied!</> : <><span>{I.copy()}</span> Copy</>}
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

const ExperimentRegistryPage = () => {
  const [filter, setFilter] = useState('All');
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);

  const STATUSES = ['All', 'pipeline', 'inprogress', 'completed', 'iterate', 'stopped'];
  const SL = { All: 'All', pipeline: 'Pipeline', inprogress: 'In Progress', completed: 'Completed', iterate: 'Iterate', stopped: 'Stopped' };

  const filtered = EXPERIMENTS.filter(e => {
    const ms = filter === 'All' || e.status === filter;
    const mq = !search || [e.name, e.team, e.owner, e.id].some(s => s.toLowerCase().includes(search.toLowerCase()));
    return ms && mq;
  });

  const summary = [
    { l: 'Total', v: EXPERIMENTS.length, c: 'text-gray-900' },
    { l: 'Pipeline', v: EXPERIMENTS.filter(e => e.status === 'pipeline').length, c: 'text-purple-700' },
    { l: 'In Progress', v: EXPERIMENTS.filter(e => e.status === 'inprogress').length, c: 'text-blue-700' },
    { l: 'Completed', v: EXPERIMENTS.filter(e => e.status === 'completed').length, c: 'text-emerald-700' },
    { l: 'Stopped', v: EXPERIMENTS.filter(e => e.status === 'stopped').length, c: 'text-red-700' },
  ];

  return (
    <div className="space-y-5">
      <div className="flex items-start justify-between">
        <div>
          <h1 className="text-xl font-semibold text-gray-900 font-sora">AI Experiment Registry</h1>
          <p className="text-sm text-gray-500 mt-0.5">Track, govern, and scale all AI use case experiments across the organisation.</p>
        </div>
        <button className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-white text-sm font-medium" style={{ backgroundColor: NAVY }}>
          {I.plus()} New Experiment
        </button>
      </div>

      <div className="grid grid-cols-5 gap-3">
        {summary.map(s => (
          <div key={s.l} className="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3 text-center">
            <div className={`text-2xl font-bold font-sora ${s.c}`}>{s.v}</div>
            <div className="text-xs text-gray-500 mt-0.5">{s.l}</div>
          </div>
        ))}
      </div>

      <div className="flex items-center gap-3 flex-wrap">
        <div className="relative">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">{I.search()}</span>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search by name, team or owner..."
            className="pl-9 pr-4 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400/30 w-64"/>
        </div>
        <div className="flex gap-2 flex-wrap">
          {STATUSES.map(s => (
            <button key={s} onClick={() => setFilter(s)}
              className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-colors ${filter === s ? 'text-white' : 'bg-white border border-gray-200 text-gray-600 hover:border-gray-300'}`}
              style={filter === s ? { backgroundColor: NAVY } : {}}>
              {SL[s]}
            </button>
          ))}
        </div>
      </div>

      <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-gray-50 border-b border-gray-100 text-left">
              {['ID', 'Experiment', 'Team', 'Owner', 'Status', 'Risk', 'Expected', 'Actual Impact', 'Decision'].map(h => (
                <th key={h} className="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide whitespace-nowrap">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-50">
            {filtered.map(e => (
              <React.Fragment key={e.id}>
                <tr onClick={() => setSelected(selected === e.id ? null : e.id)}
                  className="hover:bg-gray-50 cursor-pointer transition-colors">
                  <td className="px-4 py-3">
                    <span className="font-mono text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">{e.id}</span>
                  </td>
                  <td className="px-4 py-3">
                    <div className="font-medium text-gray-900 whitespace-nowrap">{e.name}</div>
                  </td>
                  <td className="px-4 py-3 text-xs text-gray-500 whitespace-nowrap">{e.team}</td>
                  <td className="px-4 py-3 text-xs text-gray-500">{e.owner}</td>
                  <td className="px-4 py-3"><StatusBadge s={e.status}/></td>
                  <td className={`px-4 py-3 text-xs font-semibold ${RiskDot({ r: e.risk })}`}>{e.risk}</td>
                  <td className="px-4 py-3 text-xs text-gray-600">{e.expected}</td>
                  <td className="px-4 py-3 text-xs text-gray-600">{e.actual}</td>
                  <td className="px-4 py-3"><DecisionBadge d={e.decision}/></td>
                </tr>
                {selected === e.id && (
                  <tr className="bg-slate-50">
                    <td colSpan={9} className="px-4 py-3">
                      <div className="text-xs text-slate-600 leading-relaxed">
                        <span className="font-semibold text-slate-700">Notes: </span>{e.notes}
                      </div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

const Sidebar = ({ page, setPage }) => {
  const nav = [
    { id: 'dashboard', label: 'Overview', icon: I.grid },
    { id: 'chat', label: 'Copilot Chat', icon: I.chat },
    { id: 'prompts', label: 'Prompt Library', icon: I.book },
    { id: 'experiments', label: 'Experiment Registry', icon: I.flask },
  ];
  return (
    <aside style={{ backgroundColor: NAVY, width: '216px', minWidth: '216px' }} className="h-screen flex flex-col">
      <div className="px-5 py-5 border-b border-white/10">
        <div className="text-white font-bold font-sora text-[15px] leading-snug">
          MTM Copilot
        </div>
        <div className="text-xs tracking-widest uppercase mt-0.5 font-medium" style={{ color: AMBER }}>Command Centre</div>
      </div>

      <nav className="flex-1 px-3 py-4 space-y-0.5">
        {nav.map(n => (
          <button key={n.id} onClick={() => setPage(n.id)}
            className={`nav-item ${page === n.id ? 'active' : ''} w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors ${page === n.id ? 'text-white' : 'text-white/55 hover:text-white/85'}`}>
            {n.icon()} {n.label}
          </button>
        ))}
      </nav>

      <div className="px-5 py-2">
        <div className="text-xs text-white/25 uppercase tracking-widest">Responsible AI Active</div>
      </div>

      <div className="px-5 py-4 border-t border-white/10">
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white flex-shrink-0"
            style={{ backgroundColor: AMBER }}>OO</div>
          <div>
            <div className="text-white text-xs font-semibold">Osman Orka</div>
            <div className="text-white/40 text-xs">Transformation Team</div>
          </div>
        </div>
      </div>
    </aside>
  );
};

const Header = ({ page }) => {
  const TITLES = { dashboard: 'Overview', chat: 'Copilot Chat', prompts: 'Prompt Library', experiments: 'Experiment Registry' };
  return (
    <header className="px-6 py-3.5 bg-white border-b border-gray-100 flex items-center justify-between flex-shrink-0">
      <div className="flex items-center gap-2 text-sm">
        <span className="text-gray-400">MTM Command Centre</span>
        <span className="text-gray-200">/</span>
        <span className="text-gray-800 font-medium">{TITLES[page]}</span>
      </div>
      <div className="flex items-center gap-4 text-xs text-gray-400">
        <span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500"/>AI Policy v2.1 Active</span>
        <span className="bg-gray-100 text-gray-500 px-2 py-0.5 rounded font-mono">v1.2.0</span>
      </div>
    </header>
  );
};

const App = () => {
  const [page, setPage] = useState('dashboard');
  const PAGES = {
    dashboard: <DashboardPage goto={setPage}/>,
    chat: <ChatPage/>,
    prompts: <PromptLibraryPage/>,
    experiments: <ExperimentRegistryPage/>,
  };
  return (
    <div style={{ fontFamily: "'DM Sans',sans-serif" }} className="flex h-screen overflow-hidden bg-gray-50">
      <Sidebar page={page} setPage={setPage}/>
      <div className="flex-1 flex flex-col overflow-hidden">
        <Header page={page}/>
        <main className="flex-1 overflow-y-auto px-6 py-5">
          {PAGES[page]}
        </main>
      </div>
    </div>
  );
};

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
